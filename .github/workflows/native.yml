name: Native Core

on:
  pull_request:
    paths:
      - lib/native/**
      - scripts/build-native.js
      - scripts/bench-native.js
      - test/lib/native/**
  push:
    branches:
      - latest
    paths:
      - lib/native/**
      - scripts/build-native.js
      - scripts/bench-native.js
      - test/lib/native/**

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo test
        run: cargo test --manifest-path lib/native/Cargo.toml
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build native core
        run: node scripts/build-native.js
      - name: Differential tests
        run: npx tap test/lib/native/extract.js --no-coverage
      - name: Differential check
        run: node scripts/bench-native.js --check
