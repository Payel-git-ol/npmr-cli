[package]
name = "npmr"
version = "12.2.1"
edition = "2024"
rust-version = "1.85"
description = "a package manager for JavaScript"
license = "Artistic-2.0"
authors = ["GitHub Inc."]
homepage = "https://docs.npmjs.com/"
repository = "https://github.com/Payel-git-ol/npmr-cli.git"
readme = "README.md"
keywords = ["npm", "package-manager", "node_modules"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "npmr"
path = "src/lib.rs"

[[bin]]
name = "npmr"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
glob = "0.3"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
semver = "1"
thiserror = "2"
moka = { version = "0.12", features = ["sync"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
